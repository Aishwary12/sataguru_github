<style>
/* Style for the status text */
.text-pending {
    color: #FFC107; /* Bright yellow for Pending */
    font-weight: bold;
    background-color: rgba(255, 193, 7, 0.1);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 1.1rem;
}

.text-approved {
    color: #28A745; /* Green for Approved */
    font-weight: bold;
    background-color: rgba(40, 167, 69, 0.1);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 1.1rem;
}

.text-rejected {
    color: #DC3545; /* Red for Rejected */
    font-weight: bold;
    background-color: rgba(220, 53, 69, 0.1);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 1.1rem;
}

/* Style for the buttons */
.btn-approve {
    background: linear-gradient(145deg, #28A745, #218838); /* Green gradient */
    color: white;
    border: none;
    padding: 8px 16px;
    border-radius: 5px;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.1);
    transition: background 0.3s ease, transform 0.2s ease;
}

.btn-approve:hover {
    background: linear-gradient(145deg, #218838, #28A745);
    transform: translateY(-2px); /* Slight hover lift */
}

.btn-reject {
    background: linear-gradient(145deg, #DC3545, #C82333); /* Red gradient */
    color: white;
    border: none;
    padding: 8px 16px;
    border-radius: 5px;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.1);
    transition: background 0.3s ease, transform 0.2s ease;
}

.btn-reject:hover {
    background: linear-gradient(145deg, #C82333, #DC3545);
    transform: translateY(-2px); /* Slight hover lift */
}

/* Additional hover effects for buttons */
.btn-approve:active, .btn-reject:active {
    transform: translateY(2px); /* Button press effect */
}

/* Optional: Add a focus effect */
.btn-approve:focus, .btn-reject:focus {
    outline: none;
    box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.5); /* Blue glow on focus */
}

.invisible-div {
    display: none; /* This will completely hide the div and its contents */
}

</style>
