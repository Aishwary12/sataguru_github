{% extends 'branch_manager/dashboard-base.html' %}
{% load static %}

{% block title %}
<title>Update Branch</title>
{% endblock %}

{% block contain %}
<body class="bg-gradient-primary">
    <div class="container cus-height">
        <div class="card o-hidden border-0 shadow-lg">
            <div class="card-body p-0">
                <div class="row">
                    <div class="col-lg-12">
                        <div class="p-5">
                            <div class="text-center">
                                <h1 class="h4 text-gray-900 mb-4">Update Branch</h1>
                            </div>
                            <form class="user" method="post" action="{% url 'update_branch' branch.id %}">
                                {% csrf_token %}
                                
                                <div class="form-group row">
                                    <!-- Branch Name -->
                                    <div class="col-sm-6 form-input">
                                        <label class="form-label">Branch Name</label>
                                        {{ form.branch_name }}
                                    </div>

                                    <!-- Pincode -->
                                    <div class="col-sm-6 form-input">
                                        <label class="form-label">Pincode</label>
                                        {{ form.pincode }}
                                    </div>
                                </div>

                                <div class="form-group row">
                                    <!-- Address -->
                                    <div class="col-sm-6 form-input">
                                        <label class="form-label">Address</label>
                                        {{ form.address }}
                                    </div>

                                    <!-- Branch Code -->
                                    <div class="col-sm-6 form-input">
                                        <label class="form-label">Branch Code</label>
                                        {{ form.branch_code }}
                                    </div>
                                </div>

                                <div class="text-right mt-2">
                                    <a href="{% url 'branch' %}">
                                        <button type="button" class="btn btn-danger stock_class">Cancel</button>
                                    </a>
                                    <button type="submit" class="btn btn-primary">Submit</button>
                                </div>
                            </form>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

<style>
    .select_form select {
        padding: 0 !important;
        padding-left: 16px !important;
    }
</style>
{% endblock %}
