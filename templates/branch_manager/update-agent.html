{% extends 'branch_manager/dashboard-base.html' %}
{% load static %}

{% block title %}
<title>Update Agent Assignment</title>
{% endblock %}

{% block contain %}

<body class="bg-gradient-primary">
    <div class="container cus-height">
        <div class="card o-hidden border-0 shadow-lg">
            <div class="card-body p-0">
                <div class="row">
                    <div class="col-lg-12">
                        <div class="p-5">
                            <div class="text-center">
                                <h1 class="h4 text-gray-900 mb-4">Update Agent Assignment</h1>
                            </div>

                            <form class="user" method="post" action="{% url 'update_agent_assignment' assignment.agents.id %}">
                                {% csrf_token %}
                                <div class="form-group row">
                                    <!-- Agent Name -->
                                    <div class="col-sm-6 mb-0 mb-sm-0 form-input">
                                        <label class="form-label">Agent Name</label>
                                        <input type="text" name="agents" class="form-control" value="{{ assignment.agents.name }}">
                                        
                                    </div>
                                
                                    <!-- Branch Head -->
                                    <div class="col-sm-6 mb-0 form-input">
                                        <label class="form-label">Branch Head</label>
                                        <input type="text" name="branch_head" class="form-control" value="{{ assignment.branch_head.name }}">
                                    </div>
                                
                                    <!-- Area -->
                                    <div class="col-sm-6 mb-0 form-input">
                                        <label class="form-label">Area</label>
                                        <input type="text" name="area" class="form-control" value="{{ assignment.area }}">
                                    </div>
                                </div>
                                
                                <div class="text-right mt-2">
                                    <a href="{% url 'agent' %}" class="btn btn-danger stock_class">Cancel</a>
                                    <button type="submit" class="btn btn-primary">Update</button>
                                </div>
                            </form>

                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

{% endblock %}
